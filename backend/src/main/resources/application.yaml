spring:
  application:
    name: aguiabranca
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aguiabranca}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:chave-de-desenvolvimento-com-mais-de-32-caracteres}
    horas-validade: 8
  # Secao 7: provider = gemini (default) | groq | ollama — troca de
  # provedor de IA e so isto, sem tocar em codigo. Ver tambem
  # application-groq.yaml e application-ollama.yaml.
  ia:
    provider: ${IA_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash-lite
      base-url: https://generativelanguage.googleapis.com/v1beta

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Secao 6: correlationId/userId/role no MDC (CorrelationIdFilter), em todo log.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [cid=%X{correlationId:-} uid=%X{userId:-} role=%X{role:-}] %-40.40logger{39} : %m%n"